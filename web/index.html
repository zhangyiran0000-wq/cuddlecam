<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1b19"><title>贴贴姿势相机 · CuddlePose Camera</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="finder.css"><link rel="stylesheet" href="controls.css"></head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></symbol>
<symbol id="i-album" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.2"/><path d="m4 18 5-5 3 3 3-5 5 6"/></symbol>
<symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 10h4l5-4v12l-5-4H4zM16 9c2 2 2 4 0 6m3-9c4 3 4 9 0 12"/></symbol>
<symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 10h4l5-4v12l-5-4H4zM17 9l5 6m0-6-5 6"/></symbol>
<symbol id="i-mirror" viewBox="0 0 24 24"><path d="M12 2v20M3 18l6-10v10zm18 0L15 8v10z"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx=".8"/><rect x="14" y="4" width="6" height="6" rx=".8"/><rect x="4" y="14" width="6" height="6" rx=".8"/><rect x="14" y="14" width="6" height="6" rx=".8"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 8v5l3 2M10 2h4"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M3 7h7m4 0h7M3 17h11m4 0h3"/><circle cx="12" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></symbol>
<symbol id="i-pair" viewBox="0 0 24 24"><path d="M3 8V4h4m10 0h4v4M3 16v4h4m10 0h4v-4M5.8 16.5c.4-2 1.7-3.4 4-3.4s3.6 1.4 4 3.4m.7-3.1c2.2-.3 3.5.8 3.8 2.4"/><circle cx="9.8" cy="9.8" r="2.5"/><path d="M14 7.4a2.3 2.3 0 1 1 0 4.5"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 10a7.7 7.7 0 0 0-13-3L4 9.5m0-5v5h5m-4.5 4.5a7.7 7.7 0 0 0 13 3l2.5-2.5m0 5v-5h-5"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-beauty" viewBox="0 0 24 24"><path d="M9 4c.6 4 2.6 6 6 6.5-3.4.6-5.4 2.6-6 6.5-.6-3.9-2.6-5.9-6-6.5C6.4 10 8.4 8 9 4Zm9 9c.4 2.3 1.5 3.5 3.5 4-2 .5-3.1 1.7-3.5 4-.4-2.3-1.5-3.5-3.5-4 2-.5 3.1-1.7 3.5-4Z"/></symbol>
</defs></svg>
<header class="top"><div class="brand" aria-label="贴贴姿势相机 · CuddlePose Camera"><span class="mark" aria-hidden="true"><i></i><i></i></span><span class="brand-words"><strong>贴贴姿势相机</strong><small>CuddlePose Camera</small></span></div><span class="toprule"></span><span id="step">实景选姿</span>
<button id="voice" class="voice" aria-haspopup="dialog" aria-controls="soundPanel"><svg><use href="#i-sound"/></svg><span>声音</span></button></header>
<main><canvas id="ambient" width="24" height="18" aria-hidden="true"></canvas>
<section class="stage"><div id="view"><canvas id="photo" width="960" height="540" aria-label="相机取景"></canvas><canvas id="beautyLayer" aria-hidden="true" hidden></canvas><div id="guidePlane" aria-hidden="true"><img id="outline" alt="" hidden></div>
<div class="viewmeta"><span class="finder-brand" aria-label="贴贴姿势相机 · CuddlePose Camera">贴贴 <em>CuddlePose</em></span><span id="tag">正在打开相机</span><span id="livePose"></span><span id="ratio">16:9</span></div>
<div id="roles" aria-hidden="true" hidden><span></span><span></span></div><div id="sceneToast" hidden></div></div><div id="hint" hidden></div><div id="status" role="status"></div></section>
<aside><nav id="finderTools" aria-label="相机快捷选项"><button id="settings" class="glass-tool" hidden aria-label="拍摄设置" aria-expanded="false" aria-controls="poseOptions"><svg><use href="#i-settings"/></svg></button>
<button id="finderSound" class="glass-tool" hidden aria-label="声音设置" title="声音设置" aria-haspopup="dialog" aria-controls="soundPanel"><svg><use href="#i-sound"/></svg></button>
<button id="guideBeauty" class="beauty-trigger" aria-haspopup="dialog" aria-controls="beautyPanel" hidden><svg><use href="#i-beauty"/></svg>美颜</button><button id="switchHand" type="button" class="rail-tool" aria-label="指定前摄所在边缘" title="镜头位置" hidden><svg viewBox="0 0 24 24"><path d="M3 8h17m-4-4 4 4-4 4M21 16H4m4-4-4 4 4 4"/></svg><span>镜头位置</span></button></nav>
<section id="sceneControls" hidden aria-label="实景选姿">
<button id="scan" class="rail-tool" aria-label="情侣模板" aria-controls="select" aria-expanded="false" hidden><svg><use href="#i-pair"/></svg><span>模板</span></button><button id="quickShutter" aria-label="立即拍照" title="立即拍照"></button><button id="quickBeauty" class="rail-tool" aria-haspopup="dialog" aria-controls="beautyPanel"><svg><use href="#i-beauty"/></svg><span>美颜</span></button></section>
<section id="select" aria-label="情侣模板推荐"><h1>情侣模板</h1>
<button id="chooseSource" class="primary">打开相机或相册</button><div class="row" id="recommendHead" hidden><h2 id="deckTitle">情侣模板</h2><button id="chooseSourceMini" class="link" aria-label="打开相机与相册" aria-haspopup="dialog"><svg><use href="#i-album"/></svg></button>
<div class="template-select"><button id="templateFilters" class="chip" aria-haspopup="dialog" aria-controls="typePanel">推荐 ▾</button><select hidden id="templateType" aria-label="模板类型"><option value="all">推荐</option><option value="kiss">亲吻</option><option value="close">依偎</option><option value="natural">自然</option><option value="play">俏皮</option></select></div>
<button class="link" id="nextBatch"><svg><use href="#i-refresh"/></svg><span>换一组</span></button><button class="tray-close" id="closeTray" aria-label="收起情侣模板"><svg><use href="#i-close"/></svg></button></div>
<p id="rankStatus" role="status" hidden></p><div id="cards"></div>
<div class="tray-actions" id="poseLinks" hidden><label class="intimate-pref"><input id="intimateFirst" type="checkbox" role="switch"><span aria-hidden="true"></span>色色优先</label><button class="link" id="rescan">更新取景</button><button class="link" id="browse" aria-expanded="false" aria-controls="catalog">模板库</button></div>
<div id="catalog" hidden><input id="search" type="search" aria-label="搜索模板" placeholder="搜索动作或难度"><div id="allCards"></div><nav id="libraryPager" aria-label="模板库翻页"><button id="prevPage" aria-label="上一页">‹</button><output id="pageCount"></output><button id="nextPage" aria-label="下一页">›</button></nav><p id="noMatches" hidden>这个分类里没有匹配的模板，试试其他关键词。</p><div class="library-tools"><button id="sceneAlbum" class="link" hidden>选相册背景</button><button id="editAlbum" class="link">从相册修照片</button></div></div></section>
<section id="selected" hidden><div id="poseOptions" aria-label="拍摄设置"><div class="sheet-head"><h2>拍摄设置</h2><button id="start" class="primary"><svg><use href="#i-camera"/></svg>开拍</button><button id="closeSettings" class="glass-close" aria-label="关闭拍摄设置"><svg><use href="#i-close"/></svg></button></div>
<div id="settingTabs" class="tab-strip" aria-label="设置分组"><button type="button" data-tab="0" aria-pressed="true">姿势</button><button type="button" data-tab="1" aria-pressed="false">参考线</button><button type="button" data-tab="2" aria-pressed="false">构图</button><button type="button" data-tab="3" aria-pressed="false">AI</button><button type="button" data-tab="4" aria-pressed="false">拍摄</button><button type="button" data-tab="5" aria-pressed="false">照片</button></div>
<section class="setting-page" data-page="0"><h1 id="poseTitle"></h1><div class="refrow"><img id="ref" alt="所选姿势参考照片"><div><span class="kicker">动作提示</span><p id="setup"></p></div></div><p id="why" class="why"></p><div class="pose-footer"><b id="difficulty" class="level"></b><button class="link" id="reselect">重选姿势</button></div></section>
<section class="setting-page" data-page="1" hidden><fieldset class="guide-style"><legend>参考线</legend><div class="segments">
<label><input type="radio" name="guideStyle" value="study" checked><span>起形稿</span></label><label><input type="radio" name="guideStyle" value="duet"><span>双色稿</span></label><label><input type="radio" name="guideStyle" value="comic"><span>漫画</span></label></div></fieldset><label class="ink-setting">线条浓度<input id="inkOpacity" type="range" min="40" max="100" step="5" value="85"><output id="inkValue" for="inkOpacity">85%</output></label></section>
<section class="setting-page" data-page="2" hidden><div class="adjust"><span id="fitState">等待双人入镜</span><div><button id="smaller" aria-label="缩小参考线">−</button><button id="larger" aria-label="放大参考线">＋</button><button id="fitFaces" aria-pressed="true">自动跟随</button></div></div><label class="float-setting"><span>浮动构图<small>随手机倾角微调，为风景留白</small></span><input id="floatingGuide" type="checkbox" role="switch" checked></label><button id="flip" class="link" aria-label="左右对调">左右对调</button></section>
<section class="setting-page" data-page="3" hidden><div class="scene-coach"><div><button id="sceneAsk" type="button">AI 看构图</button><label><input type="checkbox" id="sceneAuto">自动看场景</label></div><label class="compact-option"><span>AI 自适应参考线</span><input id="sceneAdapt" type="checkbox" role="switch"></label><p id="sceneNote" role="status"></p><button id="sceneApply" class="link" hidden></button></div></section>
<section class="setting-page" data-page="4" hidden><div class="in-live setting-switches"><label class="switch"><input id="auto" type="checkbox" checked> 对齐后自动拍</label><label class="switch"><input id="haptic" type="checkbox" checked> 对齐与拍照轻振</label><button id="sheetVoice" class="link" aria-haspopup="dialog" aria-controls="soundPanel">声音设置</button></div></section><section class="setting-page" data-page="5" hidden><div id="mediaOptions"><div class="actions"><label class="button soft">导入视频<input id="movie" type="file" accept="video/*"></label><label class="button soft">编辑已有照片<input id="still" type="file" accept="image/*"></label></div><button id="sample" class="link">用参考照试风格&nbsp; ↗</button></div></section>
</div>
<section id="liveControls" hidden><button id="posePicker" class="rail-tool" aria-label="更换姿势" aria-expanded="false" aria-controls="select"><img id="poseThumb" alt=""><span>换姿势</span></button><button id="shutter" aria-label="立即拍照" title="立即拍照"></button><button id="timer" class="rail-tool" aria-label="三秒倒计时"><svg><use href="#i-clock"/></svg><span>3 秒</span></button></section></section>
<section id="result" hidden><div class="result-pages"><span id="resultType" class="kicker"></span><div class="result-heading"><h1>照片漫画化</h1></div>
<nav id="resultTabs" class="tab-strip" aria-label="照片选项"><button data-result-tab="style" aria-pressed="true">画风</button><button data-result-tab="portrait" aria-pressed="false">人像</button><button data-result-tab="next" aria-pressed="false">继续拍</button></nav><section data-result-page="style"><div id="lookRail" aria-label="选择漫画画风"></div>
<label id="strengthRow" class="strength-row" hidden>画风强度<input id="strength" type="range" min="0" max="100" step="5" value="100"><output id="strengthValue" for="strength">100%</output></label>
<p id="styleNote" role="status"></p>
</section><section id="portraitTools" data-result-page="portrait" hidden>
<div id="faceTools"><div class="edit-bar"><button id="natural" class="soft">自然美颜</button><button id="resetEdit" class="link" disabled>还原</button></div>
<nav class="parameter-tabs" data-parameters="editSliders" aria-label="人像调整"><button data-parameter="smooth" aria-pressed="true">磨皮</button><button data-parameter="slim" aria-pressed="false">瘦脸</button><button data-parameter="tone" aria-pressed="false">气色</button></nav><div id="editSliders" class="edit-sliders"><label data-parameter-row="tone" hidden>气色<input type="range" id="tone" min="0" max="100" step="5" value="0"><output for="tone">0</output></label>
<label data-parameter-row="slim" hidden>瘦脸<input type="range" id="slim" min="0" max="100" step="5" value="0"><output for="slim">0</output></label>
<label data-parameter-row="smooth">磨皮<input type="range" id="smooth" min="0" max="100" step="5" value="0"><output for="smooth">0</output></label></div></div>
<p id="faceNote"></p></section><section data-result-page="next" hidden>

<div class="actions"><button id="retry" class="button soft">再拍一张</button><button id="again" class="button soft">换个姿势</button></div></section></div>
<div class="export-bar"><button id="compare" class="button" disabled>按住看原图</button><button id="save" class="primary">保存照片</button></div></section>
</aside></main>
<dialog id="beautyPanel" aria-labelledby="beautyTitle"><div class="beauty-heading"><h2 id="beautyTitle">人像美颜</h2><label class="beauty-toggle"><input id="liveBeauty" type="checkbox" role="switch" aria-label="启用美颜"><span aria-hidden="true"></span></label><button class="link" id="closeBeauty" aria-label="关闭美颜面板">完成</button></div>
<div id="beautyPresets" aria-label="美颜等级"><button data-preset="light">轻柔</button><button data-preset="natural">自然</button><button data-preset="strong">明显</button></div>
<nav class="parameter-tabs" data-parameters="beautyLevels" aria-label="美颜参数"><button data-parameter="liveSmooth" aria-pressed="true">磨皮</button><button data-parameter="liveSlim" aria-pressed="false">瘦脸</button><button data-parameter="liveTone" aria-pressed="false">气色</button></nav>
<div id="beautyLevels" class="beauty-levels"><label data-parameter-row="liveSmooth">磨皮<input id="liveSmooth" type="range" min="0" max="100" step="5"><output for="liveSmooth"></output></label><label data-parameter-row="liveSlim" hidden>瘦脸<input id="liveSlim" type="range" min="0" max="100" step="5"><output for="liveSlim"></output></label><label data-parameter-row="liveTone" hidden>气色<input id="liveTone" type="range" min="0" max="100" step="5"><output for="liveTone"></output></label></div><p id="beautyNote" role="status"></p></dialog>
<dialog id="soundPanel" aria-labelledby="soundTitle"><div class="sound-heading"><h2 id="soundTitle">声音</h2><button id="closeSound" class="link" aria-label="关闭声音设置"><svg><use href="#i-close"/></svg></button></div>
<label class="sound-option" for="shutterAudio"><span>快门音效</span><input id="shutterAudio" type="checkbox"></label>
<label class="sound-option" for="guideAudio"><span>姿势语音<small>引导、倒计时和引导拍摄完成提示</small></span><input id="guideAudio" type="checkbox" checked></label>
<label class="sound-option" for="soloVoice"><span>单人彩蛋<small>持续一人入镜时轻声提醒</small></span><input id="soloVoice" type="checkbox" checked></label><p id="soundRoute">声音跟随媒体输出。音量键由系统控制。</p>
<button id="muteAll" class="button soft">全部静音</button></dialog>
<dialog id="sourcePanel" aria-labelledby="sourceTitle"><div class="sheet-head"><h2 id="sourceTitle">相机与相册</h2><button id="closeSource" class="glass-close" aria-label="关闭相机与相册"><svg><use href="#i-close"/></svg></button></div><div class="actions source"><button id="openCam" class="primary"><svg><use href="#i-camera"/></svg>打开相机</button><label class="button soft"><svg><use href="#i-album"/></svg>选背景图<input id="backgroundFile" type="file" accept="image/*"></label></div>
<button id="editLocal" class="link" type="button">从相册修照片</button></dialog><dialog id="typePanel" aria-labelledby="typeTitle"><div class="sheet-head"><h2 id="typeTitle">模板类型</h2><button id="closeType" class="glass-close" aria-label="关闭模板类型"><svg><use href="#i-close"/></svg></button></div><div class="type-grid"><button data-type="all" aria-pressed="true">推荐</button><button data-type="kiss" aria-pressed="false">亲吻</button><button data-type="close" aria-pressed="false">依偎</button><button data-type="natural" aria-pressed="false">自然</button><button data-type="play" aria-pressed="false">俏皮</button></div></dialog><dialog id="lensPanel" aria-labelledby="lensTitle"><div class="sheet-head"><h2 id="lensTitle">前摄在哪一边？</h2><button class="glass-close" id="closeLens" aria-label="关闭镜头位置"><svg><use href="#i-close"/></svg></button></div><p>按当前握法，选前置镜头所在的屏幕边缘。</p><div class="lens-grid"><button data-lens="0">上边</button><button data-lens="1">右边</button><button data-lens="2">下边</button><button data-lens="3">左边</button></div></dialog>
<video id="video" muted playsinline></video><script type="module" src="app.mjs"></script></body></html>
